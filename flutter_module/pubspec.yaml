name: flutter_module
description: Flutter add-to-app module used after the native onboarding flow.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  module:
    androidX: true
    androidPackage: com.example.hybrid.flutter_module
    iosBundleIdentifier: com.example.hybrid.flutterModule
  uses-material-design: true
